name: nginx-lab

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app1
      - app2
      - app3
    volumes:
      - "nginx.conf:/etc/nginx/nginx.conf:ro"
      - "nginx-certs:/etc/nginx/certs:ro"
    networks:
      - app-network

  app1:
    build: ./app
    environment:
      - APP_NAME=app1
    networks:
      - app-network

  app2:
    build: ./app
    environment:
      - APP_NAME=app2
    networks:
      - app-network

  app3:
    build: ./app
    environment:
      - APP_NAME=app3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge